name: Build firmware

on:
  workflow_dispatch:
    inputs:
      mu_silicium_ref:
        description: Mu-Silicium commit to build against
        required: true
        default: e51cd877e31c8fbb322032dc4cb6715e83d25ad3
      device_repository:
        description: Device repository as owner/name
        required: true
        default: yang232138/lmipro
      device_ref:
        description: Device repository ref
        required: true
        default: main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  firmware:
    # EDK II builds on Linux with clang + lld; the kernel step needs macOS, so this
    # job only produces the firmware volume.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MU_REF: ${{ inputs.mu_silicium_ref }}
      DEVICE_REPO: ${{ inputs.device_repository }}
      DEVICE_REF: ${{ inputs.device_ref }}
    steps:
      - name: Check out UniXNU
        run: git clone --depth 1 https://github.com/yang232138/UniXNU unixnu

      - name: Check out the device repository
        run: git clone --depth 1 --branch "$DEVICE_REF" "https://github.com/$DEVICE_REPO" lmipro

      - name: Check out this overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Fetch Mu-Silicium at the pinned commit
        run: |
          mkdir uefi && cd uefi
          git init -q
          git remote add origin https://github.com/Project-Silicium/Mu-Silicium.git
          git fetch -q --depth 1 origin "$MU_REF"
          git checkout -q FETCH_HEAD
          # Binaries is provided by this overlay, so it is deliberately left out.
          git submodule update --init --depth 1 \
            Mu_Basecore Common/Mu Common/Mu_OEM_Sample \
            Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl \
            Silicium-ACPI || true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract the lmi vendor DXE set from the handset XBL
        run: |
          git clone --depth 1 https://github.com/MSMTools/UEFIReader uefi-reader
          dotnet run --project uefi-reader/UEFIReader -- overlay/inputs/xbl_4.elf extracted
          echo "== extracted tree (top) =="
          find extracted -maxdepth 3 -type d | head -30

      - name: Install the EDK II host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm nasm uuid-dev python3 python3-pip acpica-tools device-tree-compiler
          sudo python3 -m pip install --break-system-packages -r uefi/pip-requirements.txt || true

      - name: Add the lmi board overlay and its binaries
        run: |
          cp -a overlay/Platforms/. uefi/Platforms/
          cp -a overlay/BootShim/. uefi/BootShim/
          cp -a overlay/Resources/. uefi/Resources/
          mkdir -p uefi/Binaries
          rm -rf uefi/Binaries/lmi
          # The DXE modules come from the handset's own XBL, extracted above. The
          # alioth zip is retired: its board data is SM8250-AC, not lmi's SM8250.
          qcom=$(find extracted -type d -path '*/QcomPkg/Drivers' | head -1)
          if [ -z "$qcom" ]; then echo "no QcomPkg under extracted/"; find extracted -maxdepth 4 -type d | head -40; exit 1; fi
          vendor_root=$(dirname "$(dirname "$qcom")")
          echo "vendor root: $vendor_root"
          mkdir -p uefi/Binaries/lmi
          cp -a "$vendor_root"/. uefi/Binaries/lmi/
          test -f uefi/Platforms/Xiaomi/lmiPkg/lmi.dsc
          test -f uefi/Binaries/lmi/QcomPkg/Drivers/ButtonsDxe/ButtonsDxe.inf
          # unixnu bootimg appends the device tree to the kernel field instead of
          # passing --dtb, but this mkbootimg requires a non-empty dtb for header v2.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('uefi/Resources/Scripts/mkbootimg.py')
          s = p.read_text()
          old = "raise ValueError('DTB image must not be empty.')"
          if old in s:
              s = s.replace(old, "pass  # the device tree is appended to the kernel field")
              p.write_text(s)
              print('patched mkbootimg: empty dtb allowed because it is appended to the kernel')
          PY

      - name: Resolve the device configuration
        run: |
          cd unixnu
          ./unixnu defconfig lmipro_defconfig -D ../lmipro
          ./unixnu fetch -D ../lmipro
          ./unixnu status -D ../lmipro

      - name: Build the firmware volume
        run: |
          cd unixnu
          ./unixnu build firmware -D ../lmipro --uefi ../uefi

      - name: Upload the firmware volume
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SILICIUM_UEFI
          path: |
            uefi/Build/lmiPkg/**/FV/*.fd
            uefi/Build/lmiPkg/**/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Pack the boot image
        if: success()
        run: |
          cd unixnu
          ./unixnu bootimg -D ../lmipro --uefi ../uefi --dtb ../overlay/DeviceTree/lmi.dtb
          ls -l out/lmipro/*/*/boot/

      - name: Upload the boot image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmipro-boot
          path: |
            unixnu/out/**/boot/boot.img
            unixnu/out/**/boot/boot.json
          if-no-files-found: warn
          retention-days: 14
